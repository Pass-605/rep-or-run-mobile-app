# Versiones verificadas el 26/09/2026 contra kotlinlang.org y developer.android.com.
# Al subir cualquiera de las cuatro primeras hay que revisar la matriz de compatibilidad
# de Compose Multiplatform: https://kotlinlang.org/docs/multiplatform/compose-compatibility-and-versioning.html

[versions]
kotlin = "2.4.20"                 # última estable, 07/09/2026
agp = "9.1.1"                     # Android Gradle Plugin 9; 9.1 es el mínimo que piden los AAR de Compose 1.12
composeMultiplatform = "1.12.1"   # última estable, 22/09/2026
activityCompose = "1.13.0"        # androidx.activity, 11/03/2026
compileSdk = "37"                 # lo exigen los AAR de androidx.compose 1.12.1; ver README
minSdk = "26"
targetSdk = "36"                  # se queda en 36 a proposito: subirlo opta por comportamientos nuevos
# Calidad (S-04), verificadas el 28/09/2026. detekt va en 2.0 alpha porque la 1.23.8
# (feb 2025) embebe Kotlin 2.0.21; la 2.0.0-alpha.6 embebe 2.4.10 y declara soporte
# de configuration cache.
detekt = "2.0.0-alpha.6"
spotless = "8.10.3"
ktlint = "1.8.0"
# Fechas y horas del dominio (B-02), verificada el 29/09/2026 en Maven Central. Instant y
# Clock ya vienen de kotlin.time (stdlib); de aqui salen LocalDate y LocalTime.
kotlinxDatetime = "0.8.0"
# Persistencia (B-03, ADR 0002), verificadas el 30/09/2026 en Google Maven y Maven Central.
# sqlite-bundled va a la par que declara room-runtime 2.8.5. KSP 2.3 ya no lleva la versión
# de Kotlin en el número: se publica aparte y sirve para Kotlin 2.x.
room = "2.8.5"
sqlite = "2.6.2"
ksp = "2.3.12"
# Datos (B-04), verificadas el 30/09/2026 en Maven Central y Google Maven. Coroutines da los
# Flow de los repositorios; serialization lee la semilla (y la usará :core:ai para el
# contrato). DataStore 1.2.1 es la última estable; la 1.3 sigue en alpha.
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
datastore = "1.2.1"
# Armazón (S-09), verificadas el 02/10/2026 en Maven Central. Navigation se queda en la 2.9
# porque la 2.10 sigue en beta. Lifecycle 2.9.6 es la que ya arrastran Compose Multiplatform
# 1.12.1 y Koin 4.2.2: declarar otra metería dos versiones en el grafo.
koin = "4.2.2"
navigationCompose = "2.9.2"
androidxLifecycle = "2.9.6"
turbine = "1.2.1"
# Red (A-12), verificada el 16/10/2026 en Maven Central (3.6.0, 16/09/2026). Trae coroutines
# 1.11.0 y serialization 1.11.0, las mismas de arriba: no mete otra version en el grafo.
ktor = "3.6.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# Solo para compilar build-logic contra la API de los plugins (compileOnly).
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }

# Convention plugins de build-logic/ (sin versión: vienen del build incluido).
reporrun-kmp-library = { id = "reporrun.kmp.library" }
reporrun-kmp-compose = { id = "reporrun.kmp.compose" }
reporrun-feature = { id = "reporrun.feature" }
reporrun-test = { id = "reporrun.test" }
reporrun-quality = { id = "reporrun.quality" }
reporrun-root = { id = "reporrun.root" }
